<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0d0f15"/>
    </linearGradient>
    <linearGradient id="baton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a487"/>
      <stop offset="1" stop-color="#c9603f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square inside 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <!-- motion trail -->
  <g opacity="0.35" stroke="#d97757" stroke-width="22" stroke-linecap="round">
    <line x1="250" y1="560" x2="370" y2="560"/>
    <line x1="215" y1="625" x2="330" y2="625"/>
    <line x1="290" y1="495" x2="380" y2="495"/>
  </g>
  <!-- baton -->
  <g transform="rotate(-38 560 520)">
    <rect x="330" y="455" width="470" height="130" rx="65" fill="#d97757" filter="url(#glow)" opacity="0.45"/>
    <rect x="330" y="455" width="470" height="130" rx="65" fill="url(#baton)"/>
    <rect x="455" y="455" width="34" height="130" fill="#1a0f0a" opacity="0.28"/>
    <rect x="640" y="455" width="34" height="130" fill="#1a0f0a" opacity="0.28"/>
    <rect x="360" y="475" width="410" height="26" rx="13" fill="#ffffff" opacity="0.22"/>
  </g>
  <!-- check -->
  <path d="M600 735 l55 55 l115 -125" fill="none" stroke="#4fbf7f" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
